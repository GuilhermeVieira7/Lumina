services:
  # Servico de Banco de Dados Postgres (Roda isolado em container)
  db:
    image: postgres:15-alpine
    container_name: tea_database
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      # O app só sobe quando o banco já aceita conexões
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      # Só este computador acessa o banco (não fica aberto na rede)
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Aplicacao (Servira a API do FastAPI e o Frontend HTML)
  app:
    build: .
    container_name: tea_application
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:80"
    environment:
      # Inject DATABASE_URL so SQLAlchemy in FastAPI hooks into the Postgres container smoothly
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY:-}
    volumes:
      # Volumes compartilhados se precisar que dados locais subam
      # - ./backend:/app/backend
      # - ./frontend:/app/frontend
      - /app/backend/__pycache__
    
  # pgAdmin: painel web para ver e editar as tabelas do banco
  # Acesse http://localhost:5050 com PGADMIN_EMAIL e PGADMIN_PASSWORD do .env
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tea_pgadmin
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@lumina.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-lumina-pgadmin}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      # O servidor "Lumina" já aparece cadastrado no pgAdmin
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
      - pgadmin:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmin:
