# Publicação do Lumina no Render (https://render.com) com um clique:
# Dashboard do Render > New > Blueprint > escolher este repositório.
# Cria o app (a partir do Dockerfile) e um banco PostgreSQL privado.
# Passo a passo completo: docs/DEPLOY.md

services:
  - type: web
    name: lumina
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Endereço do banco (rede interna do Render, não fica exposto)
      - key: DATABASE_URL
        fromDatabase:
          name: lumina-db
          property: connectionString
      # Chave dos logins (JWT): o Render gera um valor longo e aleatório
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: lumina-db
    plan: free
    region: virginia
    databaseName: lumina
    user: lumina
    postgresMajorVersion: "15"
    # Nenhum acesso de fora: só o app do Lumina conversa com o banco
    ipAllowList: []
